name: Feature request / 功能建议
description: Describe the user problem and desired outcome.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve? / 想解决什么问题？
      description: Describe the workflow and what is currently difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
      description: Include alternatives you considered, if any.
    validations:
      required: true
