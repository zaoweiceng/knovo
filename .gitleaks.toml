title = "Knovo secret and privacy checks"

[extend]
useDefault = true

[[rules]]
id = "personal-home-path"
description = "Personal absolute home directory in published source"
regex = '''/(?:Users|home)/[A-Za-z0-9._-]+/'''

[[rules]]
id = "private-network-address"
description = "Private deployment IP; use documentation addresses in fixtures"
regex = '''\b(?:192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
